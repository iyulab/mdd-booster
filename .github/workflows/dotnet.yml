name: nuget publish

# 태그 기반 릴리스: `v0.3.0` 형식 태그를 push하면 `mdd` dotnet tool을 NuGet에 게시.
# (구 워크플로는 사라진 MDDBooster.ConsoleApp 경로를 참조해 동작 불가였음 — 현 구조로 재작성.)
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # 릴리스 게이트: 이 태그의 버전이 CHANGELOG 에 절로 존재하는가 «만» 본다.
      #
      # 이 리포는 릴리스 시점에 CHANGELOG 를 쓰는 관례인데 그것을 강제하는 것이 없었다 —
      # 잊어도 아무것도 실패하지 않고, 결과는 소비자에게 나간다. 내용의 «품질»은 검사하지
      # 않는다: 자주 막는 게이트는 곧 무시되고, 그러면 게이트가 없는 것과 같아진다.
      #
      # 위치는 checkout 직후다. Pack/Publish 를 지난 뒤 실패하면 부분 게시가 되어 같은 태그를
      # 다시 쓸 수 없으므로, 파일 하나만 읽으면 되는 검사를 뒤에 둘 이유가 없다.
      - name: Changelog gate
        run: |
          version="${GITHUB_REF_NAME#v}"
          pattern="^## \[?${version//./\.}\]?( |$)"
          if grep -qE "$pattern" CHANGELOG.md; then
            echo "CHANGELOG.md 에 ${version} 절이 있습니다."
            exit 0
          fi
          echo "::error file=CHANGELOG.md::CHANGELOG.md 에 ${version} 절이 없습니다."
          echo "이 태그가 게시할 내용을 그 절에 적은 뒤 태그를 다시 만드세요."
          echo "Pack/Publish 이전에 멈췄으므로 같은 태그를 재사용해도 안전합니다."
          exit 1

      # 릴리스 게이트: 이 태그의 버전과 게시될 csproj 의 <Version> 이 정확히 일치하는가.
      #
      # `dotnet pack` 은 csproj 를 읽지, 태그를 읽지 않는다 — 둘이 어긋나면 이 게이트 없이는
      # 태그가 v0.26.0 인데 패키지가 0.25.0 으로 게시되는 것을 막을 방법이 없다(cycle-147 이
      # 실측한 구멍). 위 CHANGELOG 게이트와 달리 이것은 «내용 품질» 판단이 아니라 두 값이
      # 같아야 한다는 등식 검사라 헛발화가 구조적으로 없다 — 자주 막는 게이트가 무시된다는
      # 우려가 여기엔 해당하지 않는다. 같은 이유로 CHANGELOG 게이트 바로 다음, Pack/Publish
      # 이전에 둔다.
      - name: Package version gate
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          csproj_version=$(grep -oPm1 '(?<=<Version>)[^<]+' src/MddBooster.Cli/MddBooster.Cli.csproj)
          if [ "$tag_version" = "$csproj_version" ]; then
            echo "태그(${tag_version})와 MddBooster.Cli.csproj 의 <Version>(${csproj_version})이 일치합니다."
            exit 0
          fi
          echo "::error file=src/MddBooster.Cli/MddBooster.Cli.csproj::태그(${tag_version})와 <Version>(${csproj_version})이 다릅니다."
          echo "csproj 의 <Version> 을 태그와 같은 값으로 맞춘 뒤 태그를 다시 만드세요."
          echo "Pack/Publish 이전에 멈췄으므로 같은 태그를 재사용해도 안전합니다."
          exit 1

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # 아래 Test 단계에 생성 TypeScript 를 `tsc --strict` 로 컴파일하는 게이트가 있다
      # (GeneratedTypeScriptCompilesTests). 그 게이트는 툴체인이 없으면 «건너뛰지 않고»
      # 스스로 `npm ci` 로 복원한 뒤 실패 시 소리내어 실패한다 — 여기서 Node 를 고정해
      # 그 복원이 러너 기본 버전에 좌우되지 않게 한다.
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: src/MddBooster.Tests/fixtures/ts-contract/package-lock.json

      # NuGet 복원 캐시: csproj 해시 키 + OS prefix fallback (CLAUDE.md GitHub Actions 정책).
      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore MddBooster.slnx

      - name: Build
        run: dotnet build MddBooster.slnx -c Release --no-restore

      # 릴리스 게이트: 게시 전 테스트 통과 필수.
      - name: Test
        run: dotnet test MddBooster.slnx -c Release --no-build

      # `mdd` 툴 패키징 — PackAsTool/ToolCommandName/PackageId는 csproj가 선언(추가 플래그 불요).
      - name: Pack
        run: dotnet pack src/MddBooster.Cli/MddBooster.Cli.csproj -c Release --no-build -o ${{ runner.temp }}/nupkg

      - name: Publish to NuGet
        run: >
          dotnet nuget push "${{ runner.temp }}/nupkg/*.nupkg"
          -k ${{ secrets.NUGET_API_KEY }}
          -s https://api.nuget.org/v3/index.json
          --skip-duplicate
